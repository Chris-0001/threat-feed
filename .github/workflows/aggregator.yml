name: Threat feed

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the :00 rush
  workflow_dispatch:
    inputs:
      accept_spike:
        description: 'Feed names (comma-separated) allowed to exceed the new-items-per-run limit'
        required: false
        default: ''

concurrency:
  group: threat-feed
  cancel-in-progress: false

permissions: {}            # deny by default; each job asks for what it needs

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # Force-kills the job before the next hour starts
    concurrency:
      group: feed-updater    # Prevents two jobs from running simultaneously
      cancel-in-progress: true
